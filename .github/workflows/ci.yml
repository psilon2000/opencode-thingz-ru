name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and python yaml
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck python3-yaml

      - name: Validate YAML frontmatter in markdown files
        run: |
          python3 - <<'PY'
          import os
          import sys
          import yaml

          failed = False
          for root, _, files in os.walk('.'):
              if root.startswith('./.git'):
                  continue
              for filename in files:
                  if not filename.endswith('.md'):
                      continue
                  path = os.path.join(root, filename)
                  with open(path, encoding='utf-8') as fh:
                      content = fh.read()
                  if not content.startswith('---\n'):
                      continue
                  end = content.find('\n---\n', 4)
                  if end == -1:
                      continue
                  frontmatter = content[4:end]
                  try:
                      yaml.safe_load(frontmatter)
                  except yaml.YAMLError as exc:
                      print(f'FAIL: {path}')
                      print(f'  {exc}')
                      failed = True

          if failed:
              sys.exit(1)

          print('All markdown frontmatter is valid YAML')
          PY

      - name: ShellCheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

      - name: Run shell tests
        run: |
          for test_file in tests/test-*.sh; do
            bash "$test_file"
          done

      - name: Run python smoke tests
        run: |
          python3 plugins/planning/opencode/scripts/plan-annotate.py --test
          python3 plugins/review/opencode/scripts/git-review.py --test
